<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="manifest.webmanifest">
<title>Kids Trading Tracker</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#dde3ea;--text:#111827;--dim:#5b6573;--up:#047857;--down:#dc2626;--accent:#2563eb;--flag:#dc26261a;--shadow:#0002}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--card:#1a212b;--line:#2a3441;--text:#e8edf2;--dim:#8b98a8;--up:#34d399;--down:#f87171;--accent:#3b82f6;--flag:#f871711a;--shadow:#0008;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--card:#1a212b;--line:#2a3441;--text:#e8edf2;--dim:#8b98a8;--up:#34d399;--down:#f87171;--accent:#3b82f6;--flag:#f871711a;--shadow:#0008;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 16px 8px;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0 0 8px}
.tabs{display:flex;gap:8px;overflow-x:auto}
.tab{padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);white-space:nowrap;font:inherit}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:16px;max-width:640px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.lbl{color:var(--dim);font-size:12px}
.val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sm{font-size:13px}
.up{color:var(--up)}.down{color:var(--down)}
h2{font-size:15px;margin:22px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.r{text-align:right;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 22px;font-weight:600;box-shadow:0 4px 14px var(--shadow)}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--down)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:16px}
dialog::backdrop{background:#0008}
#uMsg{white-space:pre-wrap;margin-bottom:6px}
label{display:block;margin:10px 0 2px;color:var(--dim);font-size:13px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.empty{color:var(--dim);text-align:center;padding:24px 0}
.err{color:var(--down);font-size:13px;margin-top:8px;min-height:1em}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);margin-right:6px}
.px{width:96px;padding:4px 6px;text-align:right}
#symWrap{position:relative}
.list{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto;box-shadow:0 6px 18px var(--shadow)}
.list div{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.list div:last-child{border:0}
.list .nm{font-size:12px;color:var(--dim)}
.hint{font-size:12px;color:var(--dim);margin-top:4px;min-height:1em}
</style>
</head>
<body>
<header>
  <h1>Kids Trading Tracker <span class="lbl">· AED</span></h1>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><noscript><div class="card">This app needs JavaScript. If you are seeing this inside a preview pane, open the page in a normal browser (Safari / Chrome) instead.</div></noscript></main>
<script>
// Diagnostic: if anything in the app script fails, show the reason instead of a blank page.
window.addEventListener('error', function (e) {
  var m = document.getElementById('main');
  if (m && !m.querySelector('.card')) m.innerHTML = '<div class="card"><b>Something went wrong starting the app.</b><div class="lbl" style="margin-top:6px;word-break:break-word">' + String(e.message || e.error || 'unknown error').replace(/</g, '&lt;') + '</div></div>';
});
</script>
<button class="fab" id="add">+ Add</button>

<dialog id="dlg">
  <form id="form" method="dialog">
    <div class="seg" id="typeSeg"></div>
    <label>Date</label><input type="date" id="fDate" required>
    <div id="symWrap"><label>Symbol — type to search (e.g. VOO, AAPL, EMAAR)</label><input id="fSym" autocapitalize="characters" autocomplete="off"><div class="list" id="symList" hidden></div><div class="hint" id="symHint"></div></div>
    <div id="qtyWrap"><label>Quantity (shares / units)</label><input id="fQty" type="number" step="any" min="0" inputmode="decimal"></div>
    <label id="pxLbl">Price per unit (AED)</label><input id="fPx" type="number" step="any" min="0" inputmode="decimal"><div class="hint" id="pxHint"></div>
    <div id="feeWrap"><label>Fees / commission (AED, optional)</label><input id="fFee" type="number" step="any" min="0" inputmode="decimal"></div>
    <label>Note (optional)</label><input id="fNote">
    <div class="err" id="err"></div>
    <div class="acts"><button type="button" class="btn" id="cancel">Cancel</button><button type="submit" class="btn pri">Save</button></div>
  </form>
</dialog>

<dialog id="menu">
  <div class="acts" style="flex-direction:column;align-items:stretch;margin:0">
    <button class="btn" id="mAddKid">Add child</button>
    <button class="btn" id="mRenKid">Rename current child</button>
    <button class="btn del" id="mDelKid">Delete current child &amp; all their data</button>
    <button class="btn" id="mShare">Share this child's trades (send to mom)</button>
    <button class="btn" id="mMerge">Merge trades from a child</button>
    <button class="btn" id="mKey">Price data API key</button>
    <button class="btn" id="mCsv">Export transactions (CSV)</button>
    <button class="btn" id="mExport">Backup (JSON)</button>
    <button class="btn" id="mImport">Restore from backup</button>
    <button class="btn" id="mClose">Close</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</dialog>

<dialog id="udlg">
  <form id="uForm" method="dialog">
    <div id="uMsg"></div>
    <input id="uIn" hidden autocomplete="off">
    <textarea id="uArea" rows="6" readonly hidden style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:12px monospace"></textarea>
    <div class="acts"><button type="button" class="btn" id="uNo">Cancel</button><span id="uAlts" style="display:contents"></span><button type="button" class="btn pri" id="uOk">OK</button></div>
  </form>
</dialog>

<dialog id="mdlg">
  <b>Merge trades</b>
  <label>Choose the file the child sent</label><input type="file" id="mFile" accept=".json,application/json,text/plain">
  <label>…or paste the text they sent</label><textarea id="mText" rows="5" style="width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:12px monospace"></textarea>
  <div class="err" id="mErr" style="color:var(--text)"></div>
  <div class="acts"><button class="btn" id="mdClose">Close</button><button class="btn pri" id="mdGo">Merge</button></div>
</dialog>

<script>
'use strict';
const KEY = 'kidsTrading.v1';
const $ = id => document.getElementById(id);
const TYPE_LABEL = { buy: 'Buy', sell: 'Sell', deposit: 'Add money', withdraw: 'Take out' };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

function ask(o) {
  return new Promise(res => {
    const d = $('udlg'), inp = $('uIn'), ar = $('uArea'), alts = $('uAlts');
    $('uMsg').textContent = o.text || '';
    inp.hidden = !o.input; inp.value = o.value || '';
    ar.hidden = o.area == null; ar.value = o.area || '';
    $('uOk').textContent = o.ok || 'OK'; $('uNo').hidden = !o.cancel; $('uNo').textContent = o.cancel || 'Cancel';
    alts.innerHTML = '';
    (o.alts || []).forEach(a => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = a.label; b.onclick = () => a.fn(b, ar); alts.appendChild(b); });
    let done = false;
    const fin = v => { if (done) return; done = true; d.close(); res(v); };
    $('uOk').onclick = () => fin(o.input ? inp.value : true);
    $('uNo').onclick = () => fin(o.input ? null : false);
    $('uForm').onsubmit = e => { e.preventDefault(); $('uOk').click(); };
    d.oncancel = e => { e.preventDefault(); fin(o.input ? null : false); };
    d.showModal();
    if (o.input) { inp.focus(); inp.select(); } else if (o.area != null) { ar.focus(); ar.select(); }
  });
}
const ui = {
  confirm: (text, ok) => ask({ text, ok: ok || 'Yes', cancel: 'Cancel' }),
  prompt: (text, value, ok) => ask({ text, input: true, value, ok: ok || 'Save', cancel: 'Cancel' }),
  notice: text => ask({ text, ok: 'OK' })
};
// Shows text the user can copy (and optionally save as a file) — works where file downloads or sharing are blocked.
function showExport(o) {
  const alts = [{ label: 'Copy', fn: async (b, ar) => { try { await navigator.clipboard.writeText(o.data); b.textContent = 'Copied ✓'; if (o.onCopy) o.onCopy(); } catch (e) { ar.focus(); ar.select(); b.textContent = 'Press and hold to copy'; } } }];
  if (o.file) alts.push({ label: 'Save file', fn: () => download(o.file, o.data, o.mime || 'text/plain') });
  return ask({ text: o.text, area: o.data, ok: 'Close', alts });
}

let S = load();
let curKid = S.kids[0] ? S.kids[0].id : null;
let editId = null, curType = 'buy';

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.kids) { s.meta = s.meta || {}; s.priceAt = s.priceAt || {}; s.tomb = s.tomb || {}; s.dirty = s.dirty || {}; return s; } } catch (e) {}
  return { kids: [], txs: [], prices: {}, meta: {}, priceAt: {}, tomb: {}, dirty: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { ui.notice('Could not save: storage is unavailable or full. Use ⋯ → Backup to keep a copy.'); } }

const aed = n => (n < 0 ? '-' : '') + Math.abs(n).toLocaleString('en-AE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n > 0 ? '+' : '') + aed(n);
const cls = n => (Math.round(n * 100) > 0 ? 'up' : Math.round(n * 100) < 0 ? 'down' : '');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Replay a kid's transactions chronologically. Average-cost method; buy fees are added to cost, sell fees reduce proceeds.
function compute(kidId) {
  const txs = S.txs.filter(t => t.kid === kidId)
    .map((t, i) => ({ t, i })).sort((a, b) => a.t.date.localeCompare(b.t.date) || a.i - b.i).map(x => x.t);
  let cash = 0, deposited = 0, withdrawn = 0, realized = 0, fees = 0;
  const pos = {}; const issues = [];
  for (const t of txs) {
    const fee = t.fee || 0;
    if (t.type === 'deposit') { cash += t.price; deposited += t.price; }
    else if (t.type === 'withdraw') { cash -= t.price; withdrawn += t.price; }
    else if (t.type === 'buy') {
      const p = pos[t.symbol] || (pos[t.symbol] = { qty: 0, cost: 0 });
      p.qty += t.qty; p.cost += t.qty * t.price + fee; cash -= t.qty * t.price + fee; fees += fee;
    } else if (t.type === 'sell') {
      const p = pos[t.symbol] || (pos[t.symbol] = { qty: 0, cost: 0 });
      if (t.qty > p.qty + 1e-9) { issues.push(t.id); continue; }
      const avg = p.cost / p.qty, costOut = avg * t.qty;
      realized += t.qty * t.price - fee - costOut; fees += fee;
      cash += t.qty * t.price - fee; p.qty -= t.qty; p.cost -= costOut;
      if (p.qty < 1e-9) { p.qty = 0; p.cost = 0; }
    }
    if (cash < -0.005) issues.push(t.id);
  }
  const holdings = Object.entries(pos).filter(([, p]) => p.qty > 0).map(([sym, p]) => {
    const last = S.prices[sym];
    const mv = last == null ? null : p.qty * last;
    return { sym, qty: p.qty, cost: p.cost, avg: p.cost / p.qty, last, mv, upl: mv == null ? null : mv - p.cost };
  });
  const mvTotal = holdings.reduce((a, h) => a + (h.mv == null ? h.cost : h.mv), 0);
  const unpriced = holdings.some(h => h.mv == null);
  const unreal = holdings.reduce((a, h) => a + (h.upl || 0), 0);
  const net = deposited - withdrawn, value = cash + mvTotal;
  return { cash, deposited, withdrawn, net, realized, unreal, fees, holdings, value, total: value - net, unpriced, issues: new Set(issues) };
}

function render() {
  const tabs = $('tabs'); tabs.innerHTML = '';
  S.kids.forEach(k => {
    const b = document.createElement('button'); b.className = 'tab' + (k.id === curKid ? ' on' : ''); b.textContent = k.name;
    b.onclick = () => { curKid = k.id; render(); }; tabs.appendChild(b);
  });
  const m = document.createElement('button'); m.className = 'tab'; m.textContent = '⋯'; m.onclick = () => $('menu').showModal(); tabs.appendChild(m);

  const main = $('main');
  $('add').style.display = curKid ? '' : 'none';
  if (!curKid) { main.innerHTML = '<div class="card" style="text-align:center;padding:24px 16px"><div style="font-size:40px">📈</div><h2 style="color:var(--text);text-transform:none;font-size:20px">Welcome!</h2><div class="lbl">Who is this for?</div><input id="firstName" placeholder="Your name" style="margin:12px 0;text-align:center" autocomplete="off"><button class="btn pri" id="firstKid" style="width:100%;padding:12px">Start</button><button class="btn" id="exampleBtn" style="width:100%;margin-top:8px">Just show me an example</button><div class="lbl" style="margin-top:12px">Mom: add each child here, then use ⋯ to merge what they send you.</div></div>';
    $('firstKid').onclick = () => { const n = $('firstName').value.trim(); if (!n) { $('firstName').focus(); return; } const k = { id: uid(), name: n }; S.kids.push(k); curKid = k.id; save(); render(); };
    $('exampleBtn').onclick = loadExample;
    return; }
  const c = compute(curKid);
  const tot = c.total;
  let h = `<div class="grid">
    <div class="card"><div class="lbl">Total value</div><div class="val">${aed(c.value)}</div><div class="lbl">cash + holdings</div></div>
    <div class="card"><div class="lbl">Total P&amp;L</div><div class="val ${cls(tot)}">${signed(tot)}</div><div class="lbl">${c.net ? signed(tot / c.net * 100).replace(/\.\d+/, m => m.slice(0, 3)) + '% of net deposits' : '—'}</div></div>
    <div class="card"><div class="lbl">Cash (held by mom)</div><div class="val ${c.cash < -0.005 ? 'down' : ''}">${aed(c.cash)}</div></div>
    <div class="card"><div class="lbl">Net deposited</div><div class="val">${aed(c.net)}</div></div>
    <div class="card"><div class="lbl">Realized P&amp;L</div><div class="val sm ${cls(c.realized)}">${signed(c.realized)}</div></div>
    <div class="card"><div class="lbl">Unrealized P&amp;L</div><div class="val sm ${cls(c.unreal)}">${signed(c.unreal)}</div></div>
  </div>`;
  h += `<button class="btn pri" id="sendMom" style="width:100%;margin-top:12px;padding:12px">📤 Send to Mom${S.dirty[curKid] ? ' · changes not sent yet' : ''}</button>`;
  if (c.unpriced) h += `<div class="lbl" style="margin-top:8px">⚠ Some holdings have no current price — valued at cost until you enter one.</div>`;
  if (c.issues.size) h += `<div class="lbl down" style="margin-top:8px">⚠ ${c.issues.size} transaction(s) flagged (oversell or negative cash) — check the highlighted rows.</div>`;

  h += '<h2>Holdings <button class="btn" id="refresh" style="float:right;padding:2px 10px;text-transform:none">↻ Refresh prices</button></h2><div class="card">';
  if (!c.holdings.length) h += '<div class="empty">No holdings</div>';
  c.holdings.sort((a, b) => a.sym.localeCompare(b.sym)).forEach(x => {
    h += `<div class="row"><div><b>${esc(x.sym)}</b><div class="lbl">${+x.qty.toFixed(6)} × avg ${aed(x.avg)}</div><div class="lbl">cost ${aed(x.cost)}</div></div>
      <div class="r"><input class="px" data-sym="${esc(x.sym)}" type="number" step="any" inputmode="decimal" placeholder="price now" value="${x.last == null ? '' : x.last}">
      <div class="lbl">${x.mv == null ? '—' : 'value ' + aed(x.mv)}${S.priceAt[x.sym] ? ' · ' + S.priceAt[x.sym] : ''}</div>
      <div class="${x.upl == null ? '' : cls(x.upl)} sm">${x.upl == null ? '' : signed(x.upl) + ' (' + signed(x.upl / x.cost * 100).replace(/(\.\d)\d*/, '$1') + '%)'}</div></div></div>`;
  });
  h += '</div><h2>Transactions</h2><div class="card">';
  const list = S.txs.filter(t => t.kid === curKid).sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) h += '<div class="empty">Nothing yet — tap + Add</div>';
  list.forEach(t => {
    const amt = t.type === 'deposit' || t.type === 'withdraw' ? t.price : t.qty * t.price;
    const detail = t.type === 'deposit' || t.type === 'withdraw' ? '' : `${esc(t.symbol)} · ${+t.qty} @ ${aed(t.price)}${t.fee ? ' · fee ' + aed(t.fee) : ''}`;
    h += `<div class="row" data-id="${t.id}" style="cursor:pointer;${c.issues.has(t.id) ? 'background:var(--flag)' : ''}">
      <div><span class="tag">${TYPE_LABEL[t.type] || t.type}</span>${detail}<div class="lbl">${t.date}${t.note ? ' · ' + esc(t.note) : ''}</div></div>
      <div class="r">${aed(amt)}</div></div>`;
  });
  h += '</div><div style="text-align:center;margin-top:20px"><button class="btn" id="mergeLink">📥 Got trades from a child? Merge</button></div>';
  if (needsInstallTip()) h = installTip() + h;
  main.innerHTML = h;
  const rb = $('refresh'); if (rb) rb.onclick = refreshPrices;
  $('sendMom').onclick = shareCurrent; $('mergeLink').onclick = () => $('mMerge').onclick();
  const tip = $('tipX'); if (tip) tip.onclick = () => { try { localStorage.setItem('kidsTrading.tip', '1'); } catch (e) {} render(); };
  main.querySelectorAll('.px').forEach(i => i.onchange = () => {
    const v = parseFloat(i.value);
    if (i.value === '') delete S.prices[i.dataset.sym]; else if (v >= 0) S.prices[i.dataset.sym] = v;
    delete S.priceAt[i.dataset.sym];
    save(); render();
  });
  main.querySelectorAll('[data-id]').forEach(r => r.onclick = () => openForm(r.dataset.id));
}

function loadExample() {
  const k = { id: uid(), name: 'Example' }; S.kids.push(k); curKid = k.id;
  const add = (type, date, symbol, qty, price, fee) => S.txs.push(Object.assign({ id: uid(), upd: Date.now(), kid: k.id, type, date, price, note: 'example' }, symbol ? { symbol, qty, fee: fee || 0 } : {}));
  add('deposit', '2026-08-01', null, 0, 6000);
  add('buy', '2026-08-03', 'VOO', 2, 1840, 5);
  add('buy', '2026-08-20', 'AAPL', 5, 220, 3);
  add('sell', '2026-09-15', 'AAPL', 2, 245, 3);
  S.prices.VOO = 1885; S.prices.AAPL = 238;
  save(); render();
}
function setType(t) {
  curType = t;
  const names = TYPE_LABEL;
  $('typeSeg').innerHTML = '';
  Object.keys(names).forEach(k => { const b = document.createElement('button'); b.type = 'button'; b.textContent = names[k]; b.className = k === t ? 'on' : ''; b.onclick = () => setType(k); $('typeSeg').appendChild(b); });
  const cash = t === 'deposit' || t === 'withdraw';
  $('symWrap').style.display = $('qtyWrap').style.display = $('feeWrap').style.display = cash ? 'none' : '';
  $('pxLbl').textContent = cash ? (t === 'deposit' ? 'How much money did you give Mom? (AED)' : 'How much did you take out? (AED)') : 'Price per share (AED)';
}
function openForm(id) {
  editId = id || null; $('err').textContent = '';
  const t = id ? S.txs.find(x => x.id === id) : null;
  setType(t ? t.type : 'buy');
  $('fDate').value = t ? t.date : today();
  pick = t && t.symbol && S.meta[t.symbol] ? Object.assign({ symbol: t.symbol }, S.meta[t.symbol]) : null; pxManual = !!t; $('symList').hidden = true; $('symHint').textContent = ''; $('pxHint').textContent = '';
  $('fSym').value = t ? t.symbol || '' : ''; $('fQty').value = t && t.qty ? t.qty : '';
  $('fPx').value = t ? t.price : ''; $('fFee').value = t && t.fee ? t.fee : ''; $('fNote').value = t ? t.note || '' : '';
  $('cancel').textContent = t ? 'Delete' : 'Cancel'; $('cancel').className = 'btn' + (t ? ' del' : '');
  $('dlg').showModal();
}
$('add').onclick = () => openForm();
$('cancel').onclick = async () => {
  if (editId && await ui.confirm('Delete this transaction?', 'Delete')) { S.txs = S.txs.filter(x => x.id !== editId); S.tomb[editId] = Date.now(); S.dirty[curKid] = true; save(); render(); }
  $('dlg').close();
};
$('form').onsubmit = async e => {
  e.preventDefault();
  const cash = curType === 'deposit' || curType === 'withdraw';
  const price = parseFloat($('fPx').value), qty = parseFloat($('fQty').value), fee = parseFloat($('fFee').value) || 0;
  const sym = $('fSym').value.trim().toUpperCase();
  const bad = m => { $('err').textContent = m; };
  if (!$('fDate').value) return bad('Pick a date.');
  if (!(price > 0)) return bad(cash ? 'Enter an amount above 0.' : 'Enter a price above 0.');
  if (!cash && !sym) return bad('Enter a symbol.');
  if (!cash && !(qty > 0)) return bad('Enter a quantity above 0.');
  if (fee < 0) return bad('Fee cannot be negative.');
  const tx = { id: editId || uid(), upd: Date.now(), kid: curKid, type: curType, date: $('fDate').value, price, note: $('fNote').value.trim() };
  if (!cash) { tx.symbol = sym; tx.qty = qty; tx.fee = fee; if (pick && pick.symbol === sym) S.meta[sym] = { mic: pick.mic, cur: pick.cur, name: pick.name }; }
  const prev = S.txs.slice();
  if (editId) S.txs = S.txs.map(x => x.id === editId ? tx : x); else S.txs.push(tx);
  const c = compute(curKid);
  if (c.issues.has(tx.id) || c.issues.size && !(await ui.confirm('This leaves some transactions invalid (selling more than held, or cash below zero). Save anyway?', 'Save anyway'))) {
    if (c.issues.has(tx.id)) { S.txs = prev; return bad(curType === 'sell' ? 'Cannot sell more than held at that date.' : 'Not enough cash at that date — add a deposit first.'); }
    S.txs = prev; return;
  }
  S.dirty[curKid] = true; save(); $('dlg').close(); render();
};

// ---- Price data (Twelve Data). The user's own free API key lives in localStorage only, never in backups. ----
const KEYK = 'kidsTrading.apikey';
const getKey = () => { try { return localStorage.getItem(KEYK) || ''; } catch (e) { return ''; } };
let pick = null, pxManual = false, searchTok = 0, priceTok = 0, searchTimer = null, dateTimer = null;

async function td(path, params) {
  const key = getKey(); if (!key) throw new Error('No API key set (⋯ menu → Price data API key)');
  const u = new URL('https://api.twelvedata.com/' + path);
  Object.entries(params).forEach(([k, v]) => { if (v != null) u.searchParams.set(k, v); });
  const r = await fetch(u, { headers: { Authorization: 'apikey ' + key } });
  const j = await r.json();
  if (j.status === 'error' || j.code >= 400) throw new Error(j.message || 'Price service error');
  return j;
}
const nextDay = d => { const x = new Date(d + 'T00:00:00Z'); x.setUTCDate(x.getUTCDate() + 1); return x.toISOString().slice(0, 10); };
// Latest price when date is today, otherwise that day's close (end_date is exclusive in the API).
async function quote(symbol, mic, date) {
  if (!date || date === today()) { const j = await td('price', { symbol, mic_code: mic }); return parseFloat(j.price); }
  const j = await td('time_series', { symbol, mic_code: mic, interval: '1day', start_date: date, end_date: nextDay(date), outputsize: 1 });
  if (!j.values || !j.values.length) throw new Error('No close for ' + date + ' (market closed?)');
  return parseFloat(j.values[0].close);
}
async function toAed(symbol, mic, cur, date) {
  const px = await quote(symbol, mic, date);
  if (!(px > 0)) throw new Error('Bad price returned');
  const rate = cur === 'AED' || !cur ? 1 : await quote(cur + '/AED', null, date);
  if (!(rate > 0)) throw new Error('Bad FX rate returned');
  return { aed: px * rate, px, rate, cur: cur || 'AED' };
}

async function autofill() {
  if (!pick || curType === 'deposit' || curType === 'withdraw' || pxManual) return;
  const tok = ++priceTok, date = $('fDate').value;
  if (!getKey()) { $('pxHint').textContent = 'Add an API key (⋯ menu) to auto-fill prices.'; return; }
  if (!date) return;
  $('pxHint').textContent = 'Fetching price…';
  try {
    const r = await toAed(pick.symbol, pick.mic, pick.cur, date);
    if (tok !== priceTok || pxManual) return;
    $('fPx').value = +r.aed.toFixed(4);
    const when = date === today() ? 'latest quote' : 'close on ' + date;
    $('pxHint').textContent = (r.cur === 'AED' ? `${r.cur} ${r.px}` : `${r.cur} ${r.px} × ${+r.rate.toFixed(4)}`) + ` · ${when}. Edit if your actual fill price differed.`;
  } catch (e) { if (tok === priceTok) $('pxHint').textContent = 'Could not fetch price: ' + e.message + ' — enter it manually.'; }
}

function showList(items) {
  const l = $('symList'); l.innerHTML = '';
  if (!items.length) { l.hidden = true; return; }
  items.forEach(it => {
    const d = document.createElement('div');
    d.innerHTML = `<b>${esc(it.symbol)}</b> <span class="nm">${esc(it.name || '')}</span><div class="nm">${esc(it.exch || '')}${it.cur ? ' · ' + esc(it.cur) : ''}${it.local ? ' · yours' : ''}</div>`;
    d.onmousedown = e => { e.preventDefault(); choose(it); };
    d.ontouchstart = e => { e.preventDefault(); choose(it); };
    l.appendChild(d);
  });
  l.hidden = false;
}
function choose(it) {
  pick = { symbol: it.symbol, mic: it.mic, cur: it.cur, name: it.name };
  $('fSym').value = it.symbol; $('symList').hidden = true;
  $('symHint').textContent = [it.name, it.exch, it.cur].filter(Boolean).join(' · ');
  pxManual = false; autofill();
}
function localMatches(q) {
  const held = new Set(S.txs.map(t => t.symbol).filter(Boolean)); Object.keys(S.meta).forEach(k => held.add(k));
  return [...held].filter(sy => !q || sy.includes(q)).sort().slice(0, 6).map(sy => {
    const m = S.meta[sy] || {}; return { symbol: sy, name: m.name, mic: m.mic, cur: m.cur, exch: m.mic, local: true };
  });
}
$('fSym').oninput = () => {
  const q = $('fSym').value.trim().toUpperCase(); pick = null; $('symHint').textContent = '';
  clearTimeout(searchTimer);
  const loc = localMatches(q); showList(loc);
  if (q.length < 1 || !getKey()) return;
  const tok = ++searchTok;
  searchTimer = setTimeout(async () => {
    try {
      const j = await td('symbol_search', { symbol: q, outputsize: 30 });
      if (tok !== searchTok) return;
      const seen = new Set(loc.map(l => l.symbol + '|' + l.mic));
      const rank = r => (r.currency === 'USD' || r.currency === 'AED' ? 0 : 1);
      const api = (j.data || []).filter(r => r.mic_code !== 'IEXG')
        .sort((a, b) => rank(a) - rank(b))
        .map(r => ({ symbol: r.symbol, name: r.instrument_name, mic: r.mic_code, cur: r.currency, exch: r.exchange }))
        .filter(r => !seen.has(r.symbol + '|' + r.mic)).slice(0, 12);
      showList(loc.concat(api));
    } catch (e) { if (tok === searchTok) $('symHint').textContent = e.message; }
  }, 350);
};
$('fSym').onfocus = () => { if (!$('fSym').value) showList(localMatches('')); };
$('fSym').onblur = () => setTimeout(() => { $('symList').hidden = true; }, 150);
$('fPx').oninput = () => { pxManual = true; $('pxHint').textContent = 'Manual price.'; };
$('fDate').onchange = () => { clearTimeout(dateTimer); dateTimer = setTimeout(() => { pxManual = false; autofill(); }, 400); };

async function refreshPrices() {
  const c = compute(curKid), btn = $('refresh');
  const targets = c.holdings.filter(h => S.meta[h.sym]);
  const skipped = c.holdings.length - targets.length;
  if (!getKey()) return ui.notice('Add your price data API key first (⋯ menu).');
  if (!targets.length) return ui.notice('No holdings with a linked symbol. Pick the symbol from the search list when adding a trade.');
  btn.disabled = true; const errs = [];
  const fxCache = {};
  const hhmm = () => new Date().toTimeString().slice(0, 5);
  for (const h of targets) {
    btn.textContent = '… ' + h.sym;
    const m = S.meta[h.sym];
    try {
      const px = await quote(h.sym, m.mic);
      let rate = 1;
      if (m.cur && m.cur !== 'AED') rate = fxCache[m.cur] || (fxCache[m.cur] = await quote(m.cur + '/AED', null));
      S.prices[h.sym] = +(px * rate).toFixed(4); S.priceAt[h.sym] = today().slice(5) + ' ' + hhmm();
    } catch (e) { errs.push(h.sym + ': ' + e.message); }
  }
  save(); render();
  const note = errs.concat(skipped ? [skipped + ' holding(s) without a linked symbol were not refreshed.'] : []);
  if (note.length) ui.notice(note.join('\n'));
}
$('mKey').onclick = async () => {
  $('menu').close();
  const k = await ui.prompt('Paste your Twelve Data API key (free at twelvedata.com). Leave empty to remove it. It is stored only on this device.', getKey());
  if (k === null) return;
  try { if (k.trim()) localStorage.setItem(KEYK, k.trim()); else localStorage.removeItem(KEYK); } catch (e) { ui.notice('Could not store the key.'); }
};

function needsInstallTip() {
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
  let seen = false; try { seen = !!localStorage.getItem('kidsTrading.tip'); } catch (e) {}
  return !standalone && !seen && /iPhone|iPad|Android/i.test(navigator.userAgent);
}
function installTip() {
  const ios = /iPhone|iPad/i.test(navigator.userAgent);
  const how = ios ? 'Tap the <b>Share</b> button, then <b>Add to Home Screen</b>.' : 'Tap the <b>⋮</b> menu, then <b>Install app</b> / <b>Add to Home screen</b>.';
  return `<div class="card" style="margin-bottom:12px;display:flex;gap:10px;align-items:flex-start"><div style="flex:1">📲 <b>Keep it on your phone:</b> ${how}</div><button class="btn" id="tipX" style="padding:2px 10px">✕</button></div>`;
}

// ---- Share / merge (no server). Entries have unique ids + an updated-time; newest wins; deletes travel as tombstones. ----
const normName = n => String(n || '').trim().toLowerCase();
function buildShare(kidId) {
  const kid = S.kids.find(k => k.id === kidId);
  const txs = S.txs.filter(t => t.kid === kidId);
  const ids = new Set(txs.map(t => t.id));
  const tomb = {}; Object.keys(S.tomb).forEach(k => { tomb[k] = S.tomb[k]; });   // tombstones are id-only, safe to send all
  const syms = new Set(txs.map(t => t.symbol).filter(Boolean)); const meta = {};
  syms.forEach(sy => { if (S.meta[sy]) meta[sy] = S.meta[sy]; });
  return { app: 'kids-trading-tracker', v: 1, from: kid.name, at: new Date().toISOString(), kid: { id: kid.id, name: kid.name }, txs, tomb, meta };
}
function mergeShare(d) {
  if (!d || d.app !== 'kids-trading-tracker' || !d.kid || !Array.isArray(d.txs)) throw new Error('This is not a trades file from this app.');
  let kid = S.kids.find(k => k.id === d.kid.id) || S.kids.find(k => normName(k.name) === normName(d.kid.name));
  let created = false;
  if (!kid) { kid = { id: d.kid.id, name: d.kid.name }; S.kids.push(kid); created = true; }
  const r = { kid: kid.name, created, added: 0, updated: 0, removed: 0, same: 0 };
  const tomb = d.tomb && typeof d.tomb === 'object' ? d.tomb : {};
  for (const [id, ts] of Object.entries(tomb)) {                       // deletes first
    const have = S.txs.find(t => t.id === id);
    if (have && (have.upd || 0) <= ts) { S.txs = S.txs.filter(t => t.id !== id); r.removed++; }
    if ((S.tomb[id] || 0) < ts) S.tomb[id] = ts;
  }
  for (const t of d.txs) {
    if (!t || !t.id || !t.type || !t.date || !(t.price > 0)) continue;   // skip malformed rows
    if (S.tomb[t.id] && S.tomb[t.id] >= (t.upd || 0)) continue;          // deleted here more recently
    const have = S.txs.find(x => x.id === t.id);
    const row = Object.assign({}, t, { kid: kid.id });
    if (!have) { S.txs.push(row); r.added++; }
    else if ((t.upd || 0) > (have.upd || 0)) { S.txs = S.txs.map(x => x.id === t.id ? row : x); r.updated++; }
    else r.same++;
  }
  Object.entries(d.meta || {}).forEach(([sy, m]) => { if (!S.meta[sy]) S.meta[sy] = m; });
  curKid = kid.id; save(); render();
  return r;
}
async function shareCurrent() {
  if (!curKid) return;
  const data = buildShare(curKid), text = JSON.stringify(data);
  const name = 'trades-' + data.kid.name.replace(/[^\w-]+/g, '_') + '-' + today() + '.json';
  try {
    const f = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'My trades' }); S.dirty[curKid] = false; save(); render(); return; }
    if (navigator.share) { await navigator.share({ text, title: 'My trades' }); S.dirty[curKid] = false; save(); render(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const kidId = curKid;
  await showExport({ text: 'Copy this and send it to Mom (for example in WhatsApp). She pastes it into Merge.', data: text, file: name, mime: 'application/json', onCopy: () => { S.dirty[kidId] = false; save(); render(); } });
}
$('mShare').onclick = () => { $('menu').close(); shareCurrent(); };
$('mMerge').onclick = () => { $('menu').close(); $('mText').value = ''; $('mErr').textContent = ''; $('mFile').value = ''; $('mdlg').showModal(); };
$('mdClose').onclick = () => $('mdlg').close();
$('mFile').onchange = async e => { const f = e.target.files[0]; if (f) $('mText').value = await f.text(); };
$('mdGo').onclick = () => {
  try {
    const raw = $('mText').value.trim(); if (!raw) throw new Error('Choose a file or paste the text first.');
    const r = mergeShare(JSON.parse(raw));
    $('mErr').textContent = `${r.kid}${r.created ? ' (new child)' : ''}: ${r.added} added, ${r.updated} updated, ${r.removed} removed, ${r.same} already up to date.`;
    $('mText').value = '';
  } catch (e) { $('mErr').textContent = e instanceof SyntaxError ? 'That text is not valid — copy the whole message.' : e.message; }
};

async function addKid() {
  const n = ((await ui.prompt('Child name?', '', 'Add')) || '').trim(); if (!n) return;
  const k = { id: uid(), name: n }; S.kids.push(k); curKid = k.id; save(); render();
}
const curName = () => (S.kids.find(k => k.id === curKid) || {}).name;
$('mClose').onclick = () => $('menu').close();
$('mAddKid').onclick = () => { $('menu').close(); addKid(); };
$('mRenKid').onclick = async () => { $('menu').close(); if (!curKid) return; const n = ((await ui.prompt('New name?', curName())) || '').trim(); if (n) { S.kids.find(k => k.id === curKid).name = n; save(); } render(); };
$('mDelKid').onclick = async () => {
  $('menu').close();
  if (!curKid) return;
  if (await ui.confirm('Delete ' + curName() + ' and ALL their transactions? This cannot be undone. Make a backup first.', 'Delete')) {
    S.txs.filter(t => t.kid === curKid).forEach(t => { S.tomb[t.id] = Date.now(); }); S.txs = S.txs.filter(t => t.kid !== curKid); S.kids = S.kids.filter(k => k.id !== curKid); curKid = S.kids[0] ? S.kids[0].id : null; save();
  }
  $('menu').close(); render();
};
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$('mExport').onclick = () => { $('menu').close(); showExport({ text: 'Backup of everything on this device. Copy it somewhere safe (for example Notes).', data: JSON.stringify(S, null, 1), file: 'trading-backup-' + today() + '.json', mime: 'application/json' }); };
$('mCsv').onclick = () => {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const rows = [['child', 'date', 'type', 'symbol', 'quantity', 'price_or_amount_AED', 'fee_AED', 'note']];
  S.txs.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t => rows.push([(S.kids.find(k => k.id === t.kid) || {}).name, t.date, t.type, t.symbol, t.qty, t.price, t.fee, t.note]));
  $('menu').close(); showExport({ text: 'All transactions as a table (CSV).', data: rows.map(r => r.map(q).join(',')).join('\n'), file: 'transactions-' + today() + '.csv', mime: 'text/csv' });
};
$('mImport').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.kids) || !Array.isArray(d.txs)) throw 0;
    if (!(await ui.confirm('Replace ALL current data with this backup?', 'Replace'))) return;
    S = { kids: d.kids, txs: d.txs, prices: d.prices || {}, meta: d.meta || {}, priceAt: d.priceAt || {}, tomb: d.tomb || {}, dirty: {} }; curKid = S.kids[0] ? S.kids[0].id : null; save(); $('menu').close(); render();
  } catch (_) { ui.notice('Not a valid backup file.'); }
  e.target.value = '';
};

render();
try { if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {}
</script>
